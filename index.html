<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Knikker Race Teller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d4f1f9, #c8f7c5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    .blokjes-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .blok {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.5em;
      font-weight: bold;
      user-select: none;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.3),
                  inset 5px 5px 15px rgba(255,255,255,0.5),
                  0 6px 12px rgba(0,0,0,0.4);
      transition: transform 0.1s;
      overflow: hidden;
    }

    .blok:active {
      transform: scale(0.95);
    }

    .blok span {
      position: relative;
      z-index: 2;
      color: black;
    }

    .blok::after {
      content: "";
      position: absolute;
      top: 15%;
      left: 25%;
      width: 35%;
      height: 35%;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      filter: blur(6px);
      pointer-events: none;
      z-index: 1;
    }

    #green { background: #4CAF50; }
    #yellow { background: #FFEB3B; }
    #red { background: #F44336; }
    #blue { background: #2196F3; }
    #orange { background: #FF9800; }

    button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }

    button:hover {
      background: #555;
    }

    #confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      opacity: 0.9;
      border-radius: 3px;
      animation: explode 2s ease-out forwards;
    }

    @keyframes explode {
      to {
        transform: translate(var(--x), var(--y)) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Knikker Race Teller</h1>

  <div class="blokjes-container">
    <div class="blok" id="green"><span>0</span></div>
    <div class="blok" id="yellow"><span>0</span></div>
    <div class="blok" id="red"><span>0</span></div>
    <div class="blok" id="blue"><span>0</span></div>
    <div class="blok" id="orange"><span>0</span></div>
  </div>

  <button id="resetBtn">Reset</button>

  <div id="confetti-container"></div>

  <!-- Geluid: applaus + juichen -->
  <audio id="cheer-sound" src="https://www.soundjay.com/human/kids-cheering-01.mp3"></audio>
  <audio id="applause-sound" src="https://www.soundjay.com/human/applause-8.mp3"></audio>

  <script>
    const blokjes = document.querySelectorAll('.blok');
    const confettiContainer = document.getElementById('confetti-container');
    const cheerSound = document.getElementById('cheer-sound');
    const applauseSound = document.getElementById('applause-sound');

    blokjes.forEach(blok => {
      blok.addEventListener('click', () => {
        let span = blok.querySelector("span");
        let count = parseInt(span.textContent);
        if (count < 5) {
          count++;
          span.textContent = count;
          if (count === 5) {
            showConfetti();
            cheerSound.currentTime = 0;
            applauseSound.currentTime = 0;
            cheerSound.play();
            applauseSound.play();
          }
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      blokjes.forEach(blok => blok.querySelector("span").textContent = '0');
      confettiContainer.innerHTML = '';
    });

    function showConfetti() {
      for (let i = 0; i < 200; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = "50%";
        confetti.style.top = "50%";
        confetti.style.backgroundColor = randomColor();
        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 400 + 100;
        confetti.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        confetti.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
        confettiContainer.appendChild(confetti);

        setTimeout(() => confetti.remove(), 2500);
      }
    }

    function randomColor() {
      const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#f00', '#00f', '#ffa500'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  </script>
</body>
</html>
